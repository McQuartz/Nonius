name: Build (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target Nonius_VST3 NoniusProbe_VST3 nonius_core_tests NoniusAnalyse --parallel

      - name: Test (Mess-Kern)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload Nonius VST3
        uses: actions/upload-artifact@v4
        with:
          name: Nonius-VST3-Windows
          path: build/plugin/Nonius_artefacts/Release/VST3/

      - name: Upload Probe VST3
        uses: actions/upload-artifact@v4
        with:
          name: NoniusProbe-VST3-Windows
          path: build/probe/NoniusProbe_artefacts/Release/VST3/

      - name: Upload Analyse-Programm
        uses: actions/upload-artifact@v4
        with:
          name: NoniusAnalyse-Windows
          path: build/tools/analyse/NoniusAnalyse_artefacts/Release/*.exe
